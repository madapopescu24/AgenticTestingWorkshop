site_name: UiPath Agentic Testing with Coding Agents
site_url: https://madapopescu24.github.io/AgenticTestingWorkshop/
site_description: Hands-on learner's handbook for planning, automating, executing, and reporting UiPath tests with coding agents
site_author: Sergey Shumilov

# hello-world-agent/ is a retired folder the sandbox mount couldn't delete.
# Excluded from the build — remove the folder locally when convenient.
exclude_docs: |
  hello-world-agent/
  # Loan Application Underwriting and recruitment pipeline pages — retired when
  # the course moved to Agentic Testing. Kept in the repo for reference.
  loan-application-underwriting/

theme:
  name: material
  logo: assets/images/Partner Success Logo.png
  favicon: assets/images/favicon.png
  font:
    text: Inter
  palette:
    scheme: default
    primary: deep orange
    accent: orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

hooks:
  - hooks/split_cols.py
  - hooks/toc_no_emoji.py

# main.py provides environment variables (training_url, training_tenant, env_label)
# driven by the COURSE_ENV env var (staging | prod). See main.py.
plugins:
  - search
  - macros:
      module_name: main

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Published navigation only. Work-in-progress pages live in mkdocs.local.yml.
nav:
  - Home: index.md
  - Setup: setup.md
  - Agenda: agenda.md
  - Agentic Testing & Coding Agents: what-is-a-coding-agent.md
  - Testing Setup: agentic-testing-hands-on.md
  - Requirements: requirements.md
  - Test Cases: test-cases.md
  - Executions: executions.md
  - Test Sets: test-sets.md
  - SAP Testing: sap-testing.md
  - Resources: resources.md
  - Next Steps: next-steps.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  generator: false
